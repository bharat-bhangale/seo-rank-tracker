# SEO Rank Tracker — Development Docker Compose
# Usage: docker compose up -d

services:
  # ── MongoDB ───────────────────────────────────
  mongo:
    image: mongo:7
    container_name: srt-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: seo-rank-tracker
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: srt-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Server ────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: srt-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file: .env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/seo-rank-tracker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src:ro   # Mount source for dev (if using ts-node)
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-5000}/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Background Workers ────────────────────────
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: srt-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/seo-rank-tracker
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENABLE_WORKERS=true
    command: ["node", "dist/jobs/worker.js"]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Client (Vite Dev Server) ──────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: srt-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
